[project]
name = "coursework_1"
version = "0.1.0"
description = "Первая курсовая работа: анализ транзакций"
authors = [
    {name = "nnc-k", email = "katkova.a1997@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=2.2.2)",
    "openpyxl (>=3.1.2)",
    "requests (>=2.32.3)",
    "python-dotenv (>=1.0.1)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
flake8 = ">=7.0.0"
black = "^26.5.1"
isort = "^9.0.1"
mypy = "^2.3.1"
pytest-cov = "^7.1.0"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 119
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 119

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [".venv", "__pycache__", "data"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]